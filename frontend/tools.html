<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools | DS LAB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tools" data-theme="tools">
  <header id="app-header"></header>
  <main class="container page">
    <section class="page-hero">
      <div><h1>Tools</h1><p>Software, languages and platforms used in the laboratory.</p></div>
      <button class="btn btn-white" id="addBtn" type="button">+ Add Tool</button>
    </section>
    <div class="toolbar">
      <div class="search-box"><span id="searchIcon"></span><input type="search" id="searchInput" placeholder="Search by tool name, category or tag" aria-label="Search"></div>
      <select id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option></select>
    </div>
    <div class="grid" id="grid"></div>
  </main>
  <footer id="app-footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/tools.js"></script>
</body>
</html>
