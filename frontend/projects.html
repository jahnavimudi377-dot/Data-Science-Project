<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | DS LAB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="projects" data-theme="projects">
  <header id="app-header"></header>
  <main class="container page">
    <section class="page-hero">
      <div><h1>Projects</h1><p>Showcase projects with descriptions, technologies, links and project details.</p></div>
      <button class="btn btn-white" id="addBtn" type="button">Add Project</button>
    </section>
    <div class="toolbar">
      <div class="search-box"><span id="searchIcon"></span><input type="search" id="searchInput" placeholder="Search projects by title, description, technology" aria-label="Search projects"></div>
      <select id="filterCategory" aria-label="Filter by category" hidden></select>
      <select id="filterStatus" aria-label="Filter by status" hidden></select>
      <select id="filterTech" aria-label="Filter by tech stack" hidden></select>
      <select id="sortBy" aria-label="Sort projects">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="titleAsc">Project Title A-Z</option>
        <option value="titleDesc">Project Title Z-A</option>
      </select>
    </div>
    <div class="result-count" id="resultCount"></div>
    <div class="grid" id="grid"></div>
  </main>
  <footer id="app-footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
